<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Việc cần làm</title>
<link rel="stylesheet" href="anh7app://_sdk/anh7-ui.css">
<script src="anh7app://_sdk/anh7-sdk.js"></script>
<style>
  body { display: flex; flex-direction: column; }
  form { display: flex; gap: 8px; padding: 14px 14px 8px; }
  form #t { flex: 1; min-width: 0; }
  form #d { width: 140px; }
  .tabs { display: flex; gap: 6px; padding: 0 14px 8px; align-items: center; }
  .tabs button { padding: 4px 10px; font-size: 12.5px; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  .tabs span { flex: 1; text-align: right; font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0 14px 14px; overflow: auto; flex: 1; }
  li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; background: var(--panel);
    border: 1px solid var(--line); margin-bottom: 6px; }
  li input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  li .tx { flex: 1; min-width: 0; word-break: break-word; }
  li.done .tx { text-decoration: line-through; color: var(--muted); }
  li .due { font-size: 11.5px; padding: 2px 7px; border-radius: 10px; background: var(--hover); white-space: nowrap; }
  li .due.late { background: #d1343822; color: var(--danger); }
  li button { padding: 3px 8px; background: transparent; color: var(--muted); }
  li button:hover { color: var(--danger); }
  .empty { text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<form id="f"><input id="t" placeholder="Thêm việc… (Enter)" autocomplete="off"><input id="d" type="date" title="Hạn chót"><button class="primary">Thêm</button></form>
<div class="tabs">
  <button data-f="all" class="on">Tất cả</button><button data-f="todo">Chưa xong</button><button data-f="done">Đã xong</button>
  <span class="muted" id="count"></span>
</div>
<ul id="list"></ul>
<script>
(function () {
  var items = [], filter = 'all';
  var $ = function (id) { return document.getElementById(id); };
  function save() { Anh7.saveLater({ items: items }, 200); }
  function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function dueText(s) {
    var d = new Date(s + 'T00:00:00'), diff = Math.round((d.getTime() - today()) / 864e5);
    if (diff === 0) return 'Hôm nay';
    if (diff === 1) return 'Ngày mai';
    if (diff === -1) return 'Hôm qua';
    return d.toLocaleDateString('vi-VN');
  }

  function render() {
    var ul = $('list');
    ul.innerHTML = '';
    var shown = items.filter(function (it) { return filter === 'all' || (filter === 'done') === it.done; })
      .sort(function (a, b) { return (a.done - b.done) || ((a.due || '9') < (b.due || '9') ? -1 : 1); });
    shown.forEach(function (it) {
      var li = document.createElement('li');
      if (it.done) li.className = 'done';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = it.done;
      cb.onchange = function () { it.done = cb.checked; save(); render(); maybeCelebrate(); };
      var tx = document.createElement('span'); tx.className = 'tx'; tx.textContent = it.text;
      tx.ondblclick = function () {
        var v = prompt('Sửa việc:', it.text);
        if (v && v.trim()) { it.text = v.trim(); save(); render(); }
      };
      li.appendChild(cb); li.appendChild(tx);
      if (it.due) {
        var du = document.createElement('span');
        du.className = 'due' + (!it.done && new Date(it.due + 'T00:00:00').getTime() < today() ? ' late' : '');
        du.textContent = dueText(it.due);
        li.appendChild(du);
      }
      var del = document.createElement('button'); del.textContent = '✕'; del.title = 'Xóa';
      del.onclick = function () { items = items.filter(function (x) { return x !== it; }); save(); render(); };
      li.appendChild(del);
      ul.appendChild(li);
    });
    if (!shown.length) ul.innerHTML = '<div class="empty muted">' + (items.length ? 'Không có việc nào ở mục này.' : 'Chưa có việc nào.') + '</div>';
    var left = items.filter(function (i) { return !i.done; }).length;
    $('count').textContent = left + ' việc chưa xong / ' + items.length;
    Anh7.setTitle(left ? 'Việc cần làm (' + left + ')' : 'Việc cần làm').catch(function () {});
  }

  function maybeCelebrate() {
    if (items.length && items.every(function (i) { return i.done; })) {
      Anh7.notify('Xong hết rồi', 'Bạn đã hoàn thành ' + items.length + ' việc.').catch(function () {});
    }
  }

  $('f').onsubmit = function (e) {
    e.preventDefault();
    var t = $('t').value.trim();
    if (!t) return;
    items.push({ text: t, done: false, due: $('d').value || '', time: Date.now() });
    $('t').value = ''; $('d').value = '';
    save(); render();
  };
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.onclick = function () {
      filter = b.dataset.f;
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      render();
    };
  });

  Anh7.storage.get().then(function (d) {
    items = Array.isArray(d.items) ? d.items : [];
    render();
    $('t').focus();
  });
})();
</script>
</body>
</html>
