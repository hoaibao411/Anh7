nts.about=<p class\="tit">Windows 12 Online</p><p>Windows 12 Online là một dự án mã nguồn mở,<br>nhằm mang đến trải nghiệm trước Windows 12 trên web<br />Dự án không giống với bản Windows 12 chính thức.<br />Sử dụng các công nghệ web tiêu chuẩn như HTML, CSS và JS.<br />Dự án không liên kết với Microsoft và không nên<br> nhầm lẫn với sản phẩm của Microsoft.<br> Đây cũng không phải máy tính đám mây Windows365.<br>Microsoft, Windows và các sản phẩm minh họa khác trong dự án này<br> là thương hiệu của Microsoft Corporation.<br />Android trong dự án này là thương hiệu của Google Inc.</p>
