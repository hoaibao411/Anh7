# about
about.name=Giới thiệu Win12 Online
about.intro=Giới thiệu
about.update=Nhật ký cập nhật
about.intro.name=<span></span>Windows 12 Online
about.intro.intro=<span></span>Giới thiệu
about.intro.intro.p1=Windows 12 Online là dự án mã nguồn mở do Starry Source phát triển, dùng HTML, CSS và JS để mô phỏng và sáng tạo Windows 12 trên web.
about.intro.intro.p2=&emsp;&emsp;Dự án được công bố trên GitHub, <a onclick\="window.open('https\://github.com/win12-online/win12','_blank');" win12_title\="https\://github.com/win12-online/win12" class\="jump">bấm vào đây để xem</a>.
about.intro.intro.p3=&emsp;&emsp;Nếu có góp ý hoặc đề xuất về dự án, vui lòng <a onclick\="window.open('https\://github.com/win12-online/win12/issues','_blank');" win12_title\="https\://github.com/win12-online/win12/issues" class\="jump">gửi issue trên GitHub</a>, vấn đề sẽ được giải quyết sớm nhất.
about.intro.intro.p4=Về tác giả Starry Source, bấm để <a onclick\="window.open('https\://tjy-gitnub.github.io/','_blank');" win12_title\="https\://tjy-gitnub.github.io/" class\="jump">xem thêm thông tin</a>.
about.intro.os=<span></span>Giấy phép mã nguồn mở
about.intro.os.p1=Đây là dự án mã nguồn mở, dùng giấy phép EPL v2.0. Giấy phép mã nguồn mở là hợp đồng có hiệu lực pháp lý. Vui lòng tự giác tuân thủ và tôn trọng công sức của người khác.
about.intro.os.p2=Theo giấy phép, bạn có thể phổ biến, phân phối, sửa đổi và phát hành lại dự án, kể cả cho mục đích cá nhân và thương mại.
about.intro.os.p3=Nhưng bạn phải ghi rõ nguồn gốc mã, <strong>bao gồm tác giả, đường dẫn dự án, v.v.</strong>, và mã nguồn phải được công khai.
about.intro.os.p4=Nếu không bổ sung hay sửa đổi gì trên dự án thì không cần công khai mã nguồn, nhưng cũng chỉ được dùng cho mục đích học tập.
about.intro.thank=<span></span>Lời cảm ơn
about.intro.thank.p1=Đặc biệt cảm ơn @NB-Group đã đóng góp quan trọng cho phần phát triển back-end của dự án\!
about.intro.contri=<span></span>Người đóng góp
about.intro.contri.p1=Cảm ơn tất cả người đóng góp cho dự án (dữ liệu thời gian thực, xếp theo số Commit)
about.intro.star.p1=&emsp;&emsp;Cảm ơn <a class\="jump" win12_title\="Tặng một Star nhé? (Chuyển tới\: https\://github.com/win12-online/win12/stargazers)" onclick\="window.open('https\://github.com/win12-online/win12/stargazers','_blank')">tất cả những ai ủng hộ chúng tôi</a>.
about.intro.others=<span></span>Khác
about.intro.others.p1=Dự án dựa trên phiên bản Windows hiện tại và không giống với bản Windows 12 chính thức.
about.intro.others.p2=Dự án không liên kết với Microsoft và không nên nhầm lẫn với sản phẩm của Microsoft. Đây cũng không phải máy tính đám mây Windows365.
about.intro.others.p3=Microsoft, Windows và các sản phẩm minh họa khác trong dự án này là thương hiệu của Microsoft Corporation. Android trong dự án này là thương hiệu của Google Inc.
about.intro.others.p4=&emsp;&emsp;Nếu bạn thấy trang này ở một website khác ngoài dự án (win12-online.github.io/win12/desktop.html), có thể bạn đang xem trang sao chép. Để vào trang gốc, vui lòng bấm <a class\="jump" win12_title\="https\://win12-online.github.io/win12/desktop.html" onclick\="window.open('https\://win12-online.github.io/win12/desktop.html','_blank')">vào đây</a>.
about.update.name=<span></span>Nhật ký cập nhật
about.intro.disclaimer=<span></span>Tuyên bố miễn trừ
about.intro.disclaimer.p1=  Win12 Online (dưới đây gọi tắt là "Win12OL" hoặc "dự án này") là một <strong>dự án sở thích mã nguồn mở hoàn toàn phi thương mại</strong>, khám phá và mô phỏng trải nghiệm tương tác của hệ điều hành đồ họa bằng công nghệ web.
about.intro.disclaimer.p2=  Bạn cần hiểu rõ rằng\: <strong>dự án này không có bất kỳ liên kết, tài trợ, cấp phép hay xác nhận nào từ Microsoft (Microsoft Corporation) hoặc các đơn vị liên quan</strong>.
about.intro.disclaimer.p3=  Tên dự án "Win12" và các cách gọi tương tự chỉ dùng để mô tả phong cách thiết kế, không đại diện cho sản phẩm của Microsoft.
about.intro.disclaimer.p4=  Mọi yếu tố hình ảnh, bao gồm bố cục và phối màu, là kết quả <strong>tái tạo độc lập</strong> của nhà phát triển dựa trên tài liệu công khai. Chúng không phải bản sao, bản sửa đổi hay sản phẩm phái sinh từ tài sản có bản quyền gốc của Microsoft.
about.intro.disclaimer.p5=  Phần lớn biểu tượng đã được nhà phát triển vẽ lại. Các biểu tượng tham chiếu để vẽ lại, cùng số ít biểu tượng chưa vẽ lại, là biểu tượng của phiên bản Windows hiện tại, chỉ dùng cho mục đích nhận diện và hiển thị. Bản quyền thuộc về Microsoft Corporation. Dự án không chứa bất kỳ mã nhị phân, API, logic nội bộ hay thành phần độc quyền nào của hệ điều hành Microsoft Windows.


